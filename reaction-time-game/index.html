<div class="flex flex-1 items-center justify-center py-10">

            <p class="w-[159px] h-[29px] font-semibold text-2xl text-[#F4F4F5] mb-2">Reaction time</p>

            <p class="w-[313px] h-6 font-normal text-sm leading-6 text-[#A1A1AA] mb-6">Wait for green, then click as quickly as you can.</p>

            <button class="w-[512px] h-[256px] rounded-2xl flex flex-col items-center justify-center gap-3 bg-[#27272A] mb-6">

              <div>
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M42 24C42 33.9411 33.9411 42 24 42C14.0589 42 6 33.9411 6 24C6 14.0589 14.0589 6 24 6C33.9411 6 42 14.0589 42 24Z" stroke-width="2" stroke="#F4F4F5"/>

<path d="M24 27C25.6569 27 27 25.6569 27 24C27 22.3431 25.6569 21 24 21C22.3431 21 21 22.3431 21 24C21 25.6569 22.3431 27 24 27Z" fill="#F4F4F5" stroke-width="2" stroke="#F4F4F5"/>
</svg>

              </div>

              <h2 class="w-[234px] h-[29-px] font-semibold text-2xl text-[#F4F4F5]">Ready when you are</h2>

              <p class="w-[85px] h-[17px] font-normal text-sm text-[#F4F4F5]">Click to start</p>

            </button>

            <div class="w-[512px] h-[84px] flex gap-3 mb-5">
              <button class="w-[250px] h-[84px] rounded-xl gap-1 bg-[#27272A] flex flex-col items-center justify-center text-center">
                <div class="w-6 h-[29px] font-normal text-2xl text-[#D9F99D]">—</div>
                <p class="w-[73px] h-[15px] font-normal text-xs text-[#A1A1AA]">Last attempt</p>
              </button>

              <button class="w-[250px] h-[84px] rounded-xl gap-1 bg-[#27272A] flex flex-col items-center justify-center text-center">
                <div class="w-6 h-[29px] font-normal text-2xl text-[#D9F99D]">—</div>
                <p class="w-[96px] h-[15px] font-normal text-xs text-[#A1A1AA]">Best this session</p>
              </button>
            </div>

            <p class="w-[512px] h-10 font-normal text-xs leading-5 flex justify-center text-[#A1A1AA] text-center">Click the panel, or focus it and press Space or Enter. Clicking before green ends the attempt.</p>
