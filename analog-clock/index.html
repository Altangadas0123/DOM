<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ee" />
    <title>Analog Clock · A moment in time</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>
  <body class="relative isolate min-h-screen min-w-[1000px] bg-[#f5f3ee] font-sans text-[#253b35] antialiased selection:bg-[#dbe4d6]">
    <div class="pointer-events-none fixed inset-0 -z-10 bg-[radial-gradient(ellipse_at_50%_45%,#ffffff_0%,#f5f3ee_65%)]"></div>
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#253b35]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#253b35]/10 bg-white/60 px-4 py-2.5 text-xs font-medium text-[#52675c] transition-colors hover:border-[#253b35]/25 hover:bg-white hover:text-[#253b35] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#52675c]"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#748174]">The everyday collection / 05</span>
      </header>

<div class="flex flex-1 items-center justify-center py-10">
        <!-- Endees ehel -->

 
        <div class="flex flex-col items-center gap-8">
          <p class="font-['Inter',sans-serif] text-xs leading-[normal] font-semibold tracking-[3.5px] whitespace-nowrap text-[#7b887c]">A MOMENT IN TIME</p>
 

          <div class="relative size-[392px] rounded-full bg-[#e9e7df] shadow-[0_24px_70px_-25px_rgba(82,97,87,0.37)]">

            <div id="dial" role="img" aria-label="Analog clock" class="absolute top-4 left-4 size-[360px] overflow-hidden rounded-full border border-[#d8dbd1] bg-[#fcfbf7]">
              <div id="ticks" class="absolute -top-px -left-px size-[360px]"></div>
              <div id="numerals" class="absolute inset-0"></div>
 
              <span class="absolute top-[99.8px] left-[158px] font-['Inter',sans-serif] text-[9px] leading-[normal] font-semibold tracking-[3px] whitespace-nowrap text-[#8f998a]">SWISS</span>
 
              <div id="hour-hand" class="absolute -top-px -left-px size-[360px]">
                <svg class="absolute top-[120.4px] left-[97.12px]" width="87" height="64" viewBox="0 0 87 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M82.8776 59.5988L3.5 3.50024" stroke-width="7" stroke-linecap="round" stroke="#253B35"/>
                </svg>
              </div>
              <div id="minute-hand" class="absolute -top-px -left-px size-[360px]">
                <svg class="absolute top-[122.43px] left-[178px]" width="114" height="60" viewBox="0 0 114 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2 57.5689L111.059 2.00049" stroke-width="4" stroke-linecap="round" stroke="#253B35"/>
                </svg>
              </div>
              <div id="second-hand" class="absolute -top-px -left-px size-[360px]">
                <svg class="absolute top-[155px] left-[179px]" width="2" height="167" viewBox="0 0 2 167" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1 1V165.4" stroke-width="2" stroke-linecap="round" stroke="#C47E57"/>
                </svg>
              </div>
 
              <svg class="absolute top-[173px] left-[173px]" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 6C10 8.20914 8.20914 10 6 10C3.79086 10 2 8.20914 2 6C2 3.79086 3.79086 2 6 2C8.20914 2 10 3.79086 10 6Z" fill="#C47E57" stroke-width="4" stroke="#FCFBF7"/>
              </svg>
            </div>
          </div>
        </div>
 

      </div>

      <footer class="flex h-16 shrink-0 items-center justify-between border-t border-[#253b35]/10 text-[10px] text-[#748174]">
        <span>Every second, thoughtfully measured.</span><span class="font-mono tracking-[2px]">ANALOG / LIVE</span>
      </footer>
    </div>
  </body>
</html>
