<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ee" />
    <title>Analog Clock · A moment in time</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>
  <body class="relative isolate min-h-screen min-w-[1000px] bg-[#f5f3ee] font-sans text-[#253b35] antialiased selection:bg-[#dbe4d6]">
    <div class="pointer-events-none fixed inset-0 -z-10 bg-[radial-gradient(ellipse_at_50%_45%,#ffffff_0%,#f5f3ee_65%)]"></div>
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#253b35]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#253b35]/10 bg-white/60 px-4 py-2.5 text-xs font-medium text-[#52675c] transition-colors hover:border-[#253b35]/25 hover:bg-white hover:text-[#253b35] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#52675c]"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#748174]">The everyday collection / 05</span>
      </header>

      <div class="flex flex-1 items-center justify-center py-10">
        <!-- Endees ehel -->
        <div class="w-[392px] h-[439px] gap-[32px] flex flex-col">

          <p class="flex justify-center font-semibold text-xs tracking-[3.5px] text-[#7B887C]">A MOMENT IN TIME</p>

          <div class="flex justify-center items-center w-[392px] h-[392px] rounded-[196px] bg-[#E9E7DF]">
            <div class="relative w-[360px] h-[360px] rounded-[180px] border border-[#D8DBD1] bg-[#FCFBF7]">

              <div id="markers" class="absolute inset-0"></div>
              <div id="numbers" class="absolute inset-0 font-normal text-2xl text-[#253B35]"></div>

              <div class="flex justify-center w-[42px] h-[11px] absolute top-[99.8px] left-[158px] font-semibold text-[9px] tracking-[3px] text-[#8F998A]">SWISS</div>

              <svg class="z-3 inset-0 absolute m-auto" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M10 6C10 8.20914 8.20914 10 6 10C3.79086 10 2 8.20914 2 6C2 3.79086 3.79086 2 6 2C8.20914 2 10 3.79086 10 6Z" fill="#C47E57" stroke-width="4" stroke="#FCFBF7"/>
</svg>

              <!-- secund -->
              <div id="second-hand" class="absolute w-full h-full">
                <svg class="absolute top-[154px] left-[178px]" width="2" height="167" viewBox="0 0 2 167" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M1 1V165.4" stroke-width="2" stroke-linecap="round" stroke="#C47E57"/>
</svg>

              </div>

              <!-- minute -->
              <div id="minute-hand" class="absolute w-full h-full">
                <svg class="absolute top-[121.43px] left-[177px]" width="114" height="60" viewBox="0 0 114 60" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M2 57.5689L111.059 2.00049" stroke-width="4" stroke-linecap="round" stroke="#253B35"/>
</svg>

              </div>

              <!-- hour -->
              <div id="hour-hand" class="w-full h-full">
                <svg class="absolute top-[119.4px] left-[96.12px]" width="87" height="64" viewBox="0 0 87 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M82.8776 59.5988L3.5 3.50024" stroke-width="7" stroke-linecap="round" stroke="#253B35"/>
</svg>

              </div>

            </div>
          </div>

        </div>
      </div>

      <footer class="flex h-16 shrink-0 items-center justify-between border-t border-[#253b35]/10 text-[10px] text-[#748174]">
        <span>Every second, thoughtfully measured.</span><span class="font-mono tracking-[2px]">ANALOG / LIVE</span>
      </footer>
    </div>
  </body>
</html>
